# DOMAIN vocabulary only: entity sub-types for what records are ABOUT. No writer stamps these labels; :Entity is merged plain and REM writes none (decision:1664), so a rename here only changes what telemetry accepts. Restart daemons after editing. Other path: SMEM_ONTOLOGY_PATH.
#
# The spine is not configurable (decision 550). Those keys are pinned in code and ignored if copied here. `Domain` in the spine list is a project's section, not these sub-types. NREM reads only the spine, so this file never decides when consolidation runs.
# Spine labels: Fact, Entity, CommunitySummary, Insight, Decision, Human, AIAgent, Project, Domain, Activity, Milestone, ReasoningTrace, ReasoningStep.
# Spine relationships: MENTIONS, REPORTS_ON, ALIASES, SUMMARIZED_BY, NEXT_STEP, WAS_ATTRIBUTED_TO, WAS_ASSISTED_BY, WAS_GENERATED_BY, PROJECT_OF, DOMAIN_OF, ACTED_ON_BEHALF_OF, SUPERSEDES, INFORMED_BY, HAD_OUTCOME, REFERENCES, GROUNDED_IN, CONSIDERED, REJECTED, UNDER_CONDITIONS, PRODUCES_INSIGHT.

# Entity sub-types under :Entity. Rename or extend to fit the domain.
labels:
  component: Component                  # software unit we build (module/class/script/daemon)
  system: System                        # service / datastore / framework / infra we run
  model: Model                          # AI/ML model
  concept: Concept                      # pattern / technique / principle / signal
  document: Document                    # spec / ADR / doc / research artifact

# Dream-cycle parameters, not schema. They tune consolidation; they do not add labels.
consolidation:
  # Minimum grounded, non-superseded facts in one (project, domain) group before a thematic synthesis. Lowered from 5 to 3 because that axis is sparser than the old entity hubs.
  density_threshold: 3
  insight_threshold: 2           # min unconsolidated judgements the G3 walk must reach (not an entity-hub count)
