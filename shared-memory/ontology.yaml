# Shared Memory Ontology Configuration
#
# This file configures ONLY the DOMAIN vocabulary — the entity sub-types and the
# typed Entity→Entity relationships that describe what your facts and decisions are
# ABOUT. Edit and GROW these as your domain evolves; they are applied at first-write
# and during REM enrichment. Restart the daemons after editing (read at startup).
# To use a non-default location: set SMEM_ONTOLOGY_PATH=/path/to/ontology.yaml
#
# ─────────────────────────────────────────────────────────────────────────────
# THE FRAMEWORK SPINE IS NOT CONFIGURABLE (decision 550).
# The spine is the framework's identity — high-signal ADR capture, alias-not-merge
# entity resolution, fact-grounding, and the summarising dream cycle. It is pinned in
# code and will ALWAYS appear in your graph regardless of this file. Every spine
# field maps 1-to-1 from the record's JSONB metadata to a determined first-write node
# or edge in Neo4j. Listed here so you know what to expect; these keys are IGNORED if
# placed in this file.
#
#   Spine node labels (always present):
#     Fact, Entity, CommunitySummary, Insight (a kind of CommunitySummary),
#     Decision, Human, AIAgent, Project, Domain, Activity, Milestone,
#     ReasoningTrace, ReasoningStep
#
#   ⚠ `Domain` above is the BELONGING AXIS — a registered SECTION of one project
#   (`operations`, `infrastructure`) — and it is spine, pinned in code. It is not
#   the "domain vocabulary" this file configures; that is the entity sub-types and
#   typed relationships below, which describe what a record is ABOUT. One word,
#   two jobs: belonging is spine, aboutness is yours.
#
#   Spine relationships (always present) — each 1-to-1 from a JSONB field:
#     MENTIONS, REPORTS_ON (legacy), ALIASES, SUMMARIZED_BY, NEXT_STEP,
#     WAS_ATTRIBUTED_TO, WAS_ASSISTED_BY, WAS_GENERATED_BY, PROJECT_OF, DOMAIN_OF,
#     ACTED_ON_BEHALF_OF, SUPERSEDES, INFORMED_BY, HAD_OUTCOME, REFERENCES,
#     GROUNDED_IN, CONSIDERED, REJECTED, UNDER_CONDITIONS, PRODUCES_INSIGHT
#
#   The consolidation dream cycle (NREM) reads ONLY these spine identifiers; your
#   domain vocabulary below enriches what the summaries READ, but never triggers or
#   decides the consolidation mechanism — so changing this file never requires any
#   framework rewrite.
# ─────────────────────────────────────────────────────────────────────────────

# DOMAIN entity sub-types (Path A multi-label under :Entity). REM assigns these
# during enrichment. Rename or extend to fit your domain.
labels:
  component: Component                  # software unit we build (module/class/script/daemon)
  system: System                        # service / datastore / framework / infra we run
  model: Model                          # AI/ML model
  concept: Concept                      # pattern / technique / principle / signal
  document: Document                    # spec / ADR / doc / research artifact

# DOMAIN typed Entity→Entity relationships. REM picks one (gated by the domain-range
# map) during enrichment; MENTIONS (spine) stays the fallback. Rename or extend.
relationships:
  depends_on: DEPENDS_ON                # needs / requires (build/config dependency)
  part_of: PART_OF                      # composition / belongs-to
  implements: IMPLEMENTS                # realises a concept / pattern
  produces: PRODUCES                    # creates output / data / artifact
  consumes: CONSUMES                    # uses another's output / data (runtime I/O)
  runs_on: RUNS_ON                      # executes on / deployed on
  configures: CONFIGURES                # controls / parametrises / governs
  describes: DESCRIBES                  # documents / specifies (Document→X)
  validates: VALIDATES                  # quality-gate / test / telemetry validates X

# Framework consolidation tuning (mechanism parameters, NOT domain vocabulary).
# Operator-tunable, but they parametrise the immutable dream cycle — not the schema.
consolidation:
  # v2 FACT GATE (Dreaming Cycle Plan to v2, §2.1): min grounded (GROUNDED_IN
  # from a Decision/Retrospective), non-superseded Facts in one registered
  # (project, domain) group to trigger a thematic synthesis. Recalibrated
  # 5 -> 3 when the gate moved off entity hubs onto this axis (a smaller,
  # sparser population by construction).
  density_threshold: 3
  insight_threshold: 2           # min unconsolidated Decisions per shared grounded Entity to fold an insight
  alias_max_hops: 2              # bound on ALIASES component traversal
