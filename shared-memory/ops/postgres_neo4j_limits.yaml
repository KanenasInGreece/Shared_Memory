# Fixed project name. Without it compose names the stack from the parent folder or cwd, so a moved file orphans `up`/`ps`/`stop` and the pinned container names collide.
name: shared-memory

services:
#---------- STORAGE LAYER ---------
  neo4j:
    # Pinned exact. 5.26.31 escapes query-log unicode (CVE-2026-1337); Cypher and the store format do not change. Never float back to `neo4j:5-community`.
    image: neo4j:5.26.31-community
    container_name: neo4j-memory
    # Loopback by default. A bare "7474:7474" publishes the corpus on every interface behind only its password. Widen DB_BIND only for a gateway on another host you trust.
    ports:
      - "${DB_BIND:-127.0.0.1}:7474:7474"
      - "${DB_BIND:-127.0.0.1}:7687:7687"
    volumes:
      # Host path comes from shared-memory/.env. install_framework.sh sets NEO4J_HOST_DIR.
      - ${NEO4J_HOST_DIR:?set NEO4J_HOST_DIR in shared-memory/.env}/data:/data:z
      - ${NEO4J_HOST_DIR}/logs:/logs:z
      - ${NEO4J_HOST_DIR}/import:/import:z
      - ${NEO4J_HOST_DIR}/plugins:/plugins:z
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      # GDS is here for alias-component grouping (gds.wcc). Restart the container after adding the plugin or it stays unloaded.
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      # backup.sh exports Cypher into the mounted /import dir. Without this, that export is refused.
      - NEO4J_apoc_export_file_enabled=true
      # Neo4j 5 needs the double underscore in these names. It refuses to start when heap max plus pagecache exceed RAM; lower them in shared-memory/.env, not in this file.
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-1G}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX:-2G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-2G}
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT

  postgres:
    # Pinned exact. pgvector >= 0.8.4 is the HNSW-vacuum floor, and this tag carries the 2026-08-13 PostgreSQL fixes. Never float it back to `pg17`.
    image: pgvector/pgvector:0.8.6-pg17
    container_name: postgres-vector
    ports:
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ${PG_DATA_DIR:?set PG_DATA_DIR in shared-memory/.env}:/var/lib/postgresql/data:z
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=agent_data
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT

# --- INFERENCE LAYER (CPU Optimized) ---
  # Bind published ports to loopback. These encoders have no authentication, and `--host 0.0.0.0` inside the container must stay or the host cannot reach them. Widen INFERENCE_BIND only for a gateway on another host you trust.
  # Both can run at once, so LLAMA_CPU_THREADS is a shared budget (the 4 below is only the hand-rolled fallback). More threads buy little once memory bandwidth is saturated; if rerank is slow, cut RERANK_MAX_DOC_CHARS or use a GPU.
  # Retriever: BGE-M3. Exactly one of CPU or GPU may own a port (8070 retriever, 8071 reranker) or the second bind fails. Pair knobs move both (CPU default 1, GPU default 0); EMBEDDER_* and RERANKER_* default to those and override one service. A 4 GB card measured well with the embedder on GPU and the reranker on CPU. All-zero means the encoder is outside this stack, so EMBEDDER_URL / RERANKER_URL must point at it or saves are refused.
  retriever-api:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-retriever
    deploy:
      replicas: ${EMBEDDER_CPU_REPLICAS:-${CPU_ENCODER_REPLICAS:-1}}
    ports: ["${INFERENCE_BIND:-127.0.0.1}:8070:8070"]
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/models:ro,z
    command: >
      -m /models/${EMBED_MODEL_SUBPATH:-gpustack/bge-m3-GGUF/bge-m3-Q8_0.gguf}
      --embedding --host 0.0.0.0 --port 8070
      --threads ${LLAMA_CPU_THREADS:-4}  -c 8192 -b 8192 -ub 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT

  # Reranker: BGE-Reranker-v2
  reranker-api:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-reranker
    # Defaults to CPU_ENCODER_REPLICAS so the pair still moves together unless this var overrides it.
    deploy:
      replicas: ${RERANKER_CPU_REPLICAS:-${CPU_ENCODER_REPLICAS:-1}}
    ports: ["${INFERENCE_BIND:-127.0.0.1}:8071:8071"]
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/models:ro,z
    command: >
      -m /models/${RERANK_MODEL_SUBPATH:-gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf}
      --rerank --host 0.0.0.0 --port 8071
      --threads ${LLAMA_CPU_THREADS:-4}  -c 8192 -b 8192 -ub 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8071/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT

  # GPU pair: Vulkan llama.cpp, off by default, same ports as the CPU pair. An Intel Arc B580 (8086:e20b) is not this service — use intel-arc-b580.yaml. ENCODER_GPU_INDEX follows driver order, not PCI order. Two containers on purpose: a shared lifecycle would let a reranker crash restart the embedder and refuse every save.
  retriever-api-gpu:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-retriever-gpu
    deploy:
      replicas: ${EMBEDDER_GPU_REPLICAS:-${GPU_ENCODER_REPLICAS:-0}}
    ports: ["${INFERENCE_BIND:-127.0.0.1}:8070:8070"]
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${GPU_RENDER_GID:-video}
    environment:
      GGML_VK_VISIBLE_DEVICES: ${ENCODER_GPU_INDEX:-0}
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/models:ro,z
      - ./encoder_gpu_or_cpu.sh:/encoder_gpu_or_cpu.sh:ro
    entrypoint: ["/bin/sh", "/encoder_gpu_or_cpu.sh"]
    # --flash-attn on is the GPU path. The entrypoint drops it and sets
    # -ngl 0 if that server exits on its own. CPU services below stay
    # without the flag: on CPU it costs RAM.
    command: >
      -m /models/${EMBED_MODEL_SUBPATH:-gpustack/bge-m3-GGUF/bge-m3-Q8_0.gguf}
      --embedding --host 0.0.0.0 --port 8070
      -ngl 99 --threads ${LLAMA_CPU_THREADS:-4} -c 8192 -b 8192 -ub 8192
      --flash-attn on
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT

  reranker-api-gpu:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-reranker-gpu
    # Leave this one on CPU on a ~4 GB card: its 8192 window overflows device memory there, and the embedder does not.
    deploy:
      replicas: ${RERANKER_GPU_REPLICAS:-${GPU_ENCODER_REPLICAS:-0}}
    ports: ["${INFERENCE_BIND:-127.0.0.1}:8071:8071"]
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${GPU_RENDER_GID:-video}
    environment:
      GGML_VK_VISIBLE_DEVICES: ${ENCODER_GPU_INDEX:-0}
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/models:ro,z
      - ./encoder_gpu_or_cpu.sh:/encoder_gpu_or_cpu.sh:ro
    entrypoint: ["/bin/sh", "/encoder_gpu_or_cpu.sh"]
    command: >
      -m /models/${RERANK_MODEL_SUBPATH:-gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf}
      --rerank --host 0.0.0.0 --port 8071
      -ngl 99 --threads ${LLAMA_CPU_THREADS:-4} -c 8192 -b 8192 -ub 8192
      --flash-attn on
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8071/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
