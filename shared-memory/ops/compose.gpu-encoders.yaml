# GPU overlay for the two encoder services (embedder + reranker).
#
# A WORKING SAMPLE, TESTED — not a prescription. The framework requires only an
# embedding endpoint and a reranking endpoint it can reach (EMBEDDER_URL /
# RERANKER_URL, defaulting to :8070 and :8071). Docker, bare llama-server, a GPU,
# another machine entirely — run them however suits your hardware. This file
# exists so there is a known-good starting point to diverge from.
#
# The base file `postgres_neo4j_limits.yaml` runs both encoders on CPU, which
# WORKS and needs no special hardware — it is simply slow (see README §7 for the
# measured numbers). This overlay moves both onto a Vulkan-capable GPU without
# changing anything else about the stack.
#
#   docker compose -f shared-memory/ops/postgres_neo4j_limits.yaml \
#                  -f shared-memory/ops/compose.gpu-encoders.yaml \
#                  --env-file shared-memory/.env up -d
#
# ⚠ Relative host paths in ${VAR:-default} values resolve against the FIRST
# compose file's own folder (shared-memory/ops/), not your shell's cwd — set
# LLM_MODELS_DIR (and the data dirs) as ABSOLUTE paths in shared-memory/.env.
# EMBED_MODEL_SUBPATH / RERANK_MODEL_SUBPATH override the model layout under
# LLM_MODELS_DIR without editing this file.
#
# Vulkan is deliberate: it is the one backend that covers Intel, AMD and NVIDIA
# from a single image, so this overlay does not branch on GPU vendor. If you run
# CUDA and prefer it, swap the image tag for a CUDA `server` build — nothing else
# here changes.
#
# ── WHY BOTH ENCODERS AND NOT THE REASONING LLM ──────────────────────────────
# These two are small (roughly 600 MB each at Q8_0), so together they occupy a
# fraction of a card while a reasoning LLM will happily eat all of it. Putting
# the pair on a GPU is therefore cheap, and it buys something a faster CPU
# cannot: it makes reranking affordable on the FULL text a record was retrieved
# on. Retrieval selects a candidate using the embedding window; if ranking then
# sees a much narrower slice, a record can be demoted for lacking the very text
# it was selected for. On CPU that narrowing is forced by latency. On a GPU it
# is not — so raise RERANK_MAX_DOC_CHARS to match EMBED_MAX_CHARS once you move.
#
# ── TWO CONTAINERS, NOT ONE, AND THIS IS NOT AN ACCIDENT ─────────────────────
# It is tempting to run both servers inside a single GPU container. Do not.
# The embedder is on the CRITICAL WRITE PATH — a save is REFUSED with 503 rather
# than stored without a vector, because an unvectorised row is invisible to
# semantic search forever. The reranker is on the read path and DEGRADES: when
# it fails, search falls back to vector order and still answers. Sharing one
# container lifecycle would let a reranker crash or OOM restart the embedder and
# stop all writes — turning a degradable read fault into a total write outage.
# One image, two containers keeps the packaging benefit without that coupling.

services:
  retriever-api:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    # Whole-DRI passthrough. `devices:` is the portable form; a deployment that
    # restricts it to one render node can name that node instead, e.g.
    # /dev/dri/renderD128. The container also needs membership of the group that
    # owns the render node — GPU_RENDER_GID, see .env.example.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${GPU_RENDER_GID:-video}
    environment:
      # WHICH card. llama.cpp enumerates Vulkan devices as Vulkan0, Vulkan1, …
      # in driver order, which is NOT guaranteed to match your PCI order — check
      # the container's startup log, which prints each device it found, before
      # assuming an index. Pinning both encoders to the SAME card is the intent:
      # it leaves the other free for a reasoning LLM.
      GGML_VK_VISIBLE_DEVICES: ${ENCODER_GPU_INDEX:-0}
    command: >
      -m /models/${EMBED_MODEL_SUBPATH:-gpustack/bge-m3-GGUF/bge-m3-Q8_0.gguf}
      --embedding --host 0.0.0.0 --port 8070
      -ngl 99 -c 8192 -b 8192 -ub 8192

  reranker-api:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${GPU_RENDER_GID:-video}
    environment:
      GGML_VK_VISIBLE_DEVICES: ${ENCODER_GPU_INDEX:-0}
    command: >
      -m /models/${RERANK_MODEL_SUBPATH:-gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf}
      --rerank --host 0.0.0.0 --port 8071
      -ngl 99 -c 8192 -b 8192 -ub 8192
