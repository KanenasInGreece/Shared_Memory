services:
#---------- STORAGE LAYER ---------
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-memory
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      # Host data dirs come from the framework env (shared-memory/.env); the
      # first-install script (scripts/install_framework.sh) sets NEO4J_HOST_DIR.
      - ${NEO4J_HOST_DIR:?set NEO4J_HOST_DIR in shared-memory/.env}/data:/data:z
      - ${NEO4J_HOST_DIR}/logs:/logs:z
      - ${NEO4J_HOST_DIR}/import:/import:z
      - ${NEO4J_HOST_DIR}/plugins:/plugins:z
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      # graph-data-science (GDS) added for ADR-017 alias-component grouping
      # (gds.wcc) and the deferred graph-quality pass (gds.nodeSimilarity,
      # embeddings, stable componentIds for growth deltas). GDS Community tier
      # is free and runs on neo4j:5-community; the official plugin auto-matches
      # the server version. Restart the container to load it.
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      # APOC + GDS Security Procedures
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      # Allow APOC to write the backup export into the mounted /import dir
      # (ops/backup.sh → apoc.export.cypher.all). Online, no container stop.
      - NEO4J_apoc_export_file_enabled=true
      # Corrected Neo4j 5 Memory Mapping (Note the double underscores __)
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=2G
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    restart: always

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-vector
    ports:
      - "5432:5432"
    volumes:
      - ${PG_DATA_DIR:?set PG_DATA_DIR in shared-memory/.env}:/var/lib/postgresql/data:z
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=agent_data
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: always

# --- INFERENCE LAYER (CPU Optimized) ---
  # Retriever: BGE-M3
  retriever-api:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-retriever
    ports: ["8070:8070"]
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/models:ro,z
    command: >
      -m /models/gpustack/bge-m3-GGUF/bge-m3-Q8_0.gguf
      --embedding --host 0.0.0.0 --port 8070 --threads 4  -c 8192 -b 8192 -ub 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  # Reranker: BGE-Reranker-v2
  reranker-api:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-reranker
    ports: ["8071:8071"]
    volumes:
      - ${LLM_MODELS_DIR:-./models}:/models:ro,z
    command: >
      -m /models/gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf
      --rerank --host 0.0.0.0 --port 8071 --threads 4  -c 8192 -b 8192 -ub 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8071/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
