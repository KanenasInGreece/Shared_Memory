# Shared Memory Ontology Configuration
#
# Override any value to customise the Neo4j graph schema for your deployment.
# Restart all scripts after editing — values are read at startup.
#
# To use a non-default location: set SMEM_ONTOLOGY_PATH=/path/to/ontology.yaml

labels:
  fact: Fact                           # primary node for every saved artifact
  entity: Entity                       # named entity extracted from artifact metadata
  community_summary: CommunitySummary  # LLM-synthesised thematic narrative (daemon-written)
  reasoning_trace: ReasoningTrace      # root node of an agent reasoning session
  reasoning_step: ReasoningStep        # individual step within a ReasoningTrace chain
  # Provenance layer (Phase A — PROV-O inspired)
  decision: Decision                   # an architectural or design decision
  human: Human                         # a person who makes or owns a decision
  ai_agent: AIAgent                    # an AI tool that assisted in a session
  project: Project                     # project scope — root for decisions and milestones
  activity: Activity                   # a work session or task context
  milestone: Milestone                 # a significant achievement marker
  # Entity type sub-labels (Path A multi-label under :Entity; decision 472).
  # Staged rollout: defined now; REM assigns them (Stage 1.3) + one-time backfill
  # (1.4). Person/Agent/Process reuse Human/AIAgent/Activity above.
  component: Component                  # software unit we build (module/class/script/daemon)
  system: System                       # service / datastore / framework / infra we run
  model: Model                         # AI/ML model
  concept: Concept                     # pattern / technique / principle / signal
  document: Document                   # spec / ADR / doc / research artifact

relationships:
  entity_link: MENTIONS          # primary Fact→Entity relationship written on save
  entity_link_alias: REPORTS_ON  # legacy alias accepted by consolidation clustering
  aliases: ALIASES               # Entity↔Entity soft synonym edge (ADR-017 "A"); REM-written, LLM-gated, never merges nodes
  summarized_by: SUMMARIZED_BY   # Fact→CommunitySummary, written by consolidation daemon
  reasoning_next: NEXT_STEP      # links consecutive ReasoningStep nodes
  # Provenance relationships (Phase A — PROV-O inspired)
  was_attributed_to: WAS_ATTRIBUTED_TO     # Decision→Human: who owns the decision
  was_assisted_by: WAS_ASSISTED_BY         # Decision→AIAgent: which AI tool assisted
  was_generated_by: WAS_GENERATED_BY       # Decision→Activity: which session produced it
  project_of: PROJECT_OF                   # Decision/Activity→Project: project context
  acted_on_behalf_of: ACTED_ON_BEHALF_OF   # AIAgent→Human: delegation chain
  supersedes: SUPERSEDES                   # Decision→Decision: replaces a prior decision
  informed_by: INFORMED_BY                 # Decision→Decision: prior knowledge used
  had_outcome: HAD_OUTCOME                 # Decision→Decision/Milestone: retrospective edge
  references: REFERENCES                    # Fact/Decision→Fact/Decision: cross-reference resolved from content (Stage 1.2b)
  # REM-enrichment relationships (written by rem_loop.py during idle processing)
  produces_insight: PRODUCES_INSIGHT       # Fact/Decision→Entity: insight or knowledge this node generates
  under_conditions: UNDER_CONDITIONS       # Decision→Entity: constraints or conditions that bound the decision
  considered: CONSIDERED                   # Decision→Entity: alternatives that were evaluated
  rejected: REJECTED                       # Decision→Entity: alternatives explicitly ruled out
  # Typed Entity→Entity domain relationships (decision 472). REM picks one (Stage 1.3)
  # gated by the domain-range map; MENTIONS stays as fallback until per-edge confidence
  # retires it in v0.6.1 (strict ontology).
  depends_on: DEPENDS_ON                   # Entity→Entity: needs / requires (build/config dependency)
  part_of: PART_OF                         # Entity→Entity: composition / belongs-to
  implements: IMPLEMENTS                   # Entity→Entity: realises a concept / pattern
  produces: PRODUCES                       # Entity→Entity: creates output / data / artifact
  consumes: CONSUMES                       # Entity→Entity: uses another's output / data (runtime I/O)
  runs_on: RUNS_ON                         # Entity→Entity: executes on / deployed on
  configures: CONFIGURES                   # Entity→Entity: controls / parametrises / governs
  describes: DESCRIBES                     # Entity→Entity: documents / specifies (Document→X)
  validates: VALIDATES                     # Entity→Entity: quality-gate / test / telemetry validates X

consolidation:
  density_threshold: 5           # min unconsolidated Facts per Entity hub to trigger synthesis
  insight_threshold: 2           # min unconsolidated Decisions on a shared grounded Entity to fold an insight
  alias_max_hops: 2              # bound on ALIASES component traversal (class(e) = (e)-[:ALIASES*0..H]-(m)); caps alias-chain drift
